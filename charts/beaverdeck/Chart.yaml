apiVersion: v2
name: beaverdeck
description: Helm chart for BeaverDeck, a lightweight Kubernetes operations, optimization and triage tool
type: application
version: 2.2.13
appVersion: "1.7.0"
home: https://beaverdeck.io
sources:
  - https://github.com/arequs/beaverdeck
icon: https://raw.githubusercontent.com/arequs/beaverdeck/main/ui/public/logo.png
annotations:
  artifacthub.io/images: |
    - name: beaverdeck
      image: docker.io/arequs/beaverdeck:1.7.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/changes: |
    - kind: added
      description: "Added direct browser routes for Dashboard and Events, including permission-checked URL filters and return navigation after a fresh sign-in."
    - kind: security
      description: "Hardened authentication redirects against ambiguous forwarded prefixes and prevented credential-bearing return destinations."
    - kind: changed
      description: "Added runtime base-path support for routed SPA navigation while preserving existing local, Google, OIDC, and Entra authentication behavior."
