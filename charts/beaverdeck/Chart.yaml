apiVersion: v2
name: beaverdeck
description: Helm chart for BeaverDeck, a lightweight Kubernetes operations, optimization and triage tool
type: application
version: 2.2.7
appVersion: "1.6.2"
home: https://beaverdeck.io
sources:
  - https://github.com/arequs/beaverdeck
icon: https://raw.githubusercontent.com/arequs/beaverdeck/main/ui/public/logo.png
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Session tokens are now tracked server-side and revoked immediately on logout, tab close, or page refresh, instead of only clearing client-side state."
    - kind: fixed
      description: "POST /api/auth/logout no longer a no-op; a copied or leaked token stops working as soon as the user logs out, refreshes, or closes the tab."
    - kind: changed
      description: "Added a pagehide handler that notifies the server via a keepalive request when a tab is closed, refreshed, or navigated away from."
