apiVersion: v2
name: beaverdeck
description: Helm chart for BeaverDeck, a lightweight Kubernetes operations, optimization and triage tool
type: application
version: 2.2.5
appVersion: "1.6.0"
home: https://beaverdeck.io
sources:
  - https://github.com/arequs/beaverdeck
icon: https://raw.githubusercontent.com/arequs/beaverdeck/main/ui/public/logo.png
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "Added pod-scoped Restart Diagnostics snapshots with bounded metrics, events, logs, node context, and persistent-storage details."
    - kind: added
      description: "Added dynamic CRD and custom-resource browsing with namespace-aware actions."
    - kind: added
      description: "Added Applications inventory and history for Helm releases and Argo CD Applications."
    - kind: security
      description: "Updated Go 1.27, closed the Apply YAML namespace bypass, and updated vulnerable dependencies."
    - kind: security
      description: "Enabled RuntimeDefault seccomp and a read-only root filesystem, bounded request amplification, and made auth Secret persistence atomic."
    - kind: changed
      description: "Added wildcard custom-resource and explicit pod-eviction RBAC; review the generated ClusterRole before upgrade."
