apiVersion: v2
name: beaverdeck
description: Helm chart for BeaverDeck, a lightweight Kubernetes operations, optimization and triage tool
type: application
version: 2.2.4
appVersion: "1.5.3"
home: https://beaverdeck.io
sources:
  - https://github.com/arequs/beaverdeck
icon: https://raw.githubusercontent.com/arequs/beaverdeck/main/ui/public/logo.png
annotations:
  artifacthub.io/changes: |
    - kind: security
      description: "Restricted secrets:view to metadata listing; Secret manifests and decoded data now require secrets:edit."
    - kind: fixed
      description: "Wrapped long log lines inside the dock instead of allowing them to expand the log frame."
    - kind: changed
      description: "Added consistent 400 ms action tooltips and aligned the role editor with enforced permissions."
    - kind: changed
      description: "Updated React and React DOM to 19.2.8, lucide-react to 1.26.0, and Vite to 8.1.5."
