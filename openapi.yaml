openapi: 3.0.3
info:
  title: BeaverDeck API
  version: 1.6.1
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: OK }
  /api/namespaces:
    get:
      responses: { '200': { description: Namespaces } }
  /api/workloads:
    get:
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
      responses: { '200': { description: Workloads } }
  /api/pods:
    get:
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: include_metrics
          description: Set to 0 to skip per-pod Metrics API collection.
          schema: { type: integer, enum: [0, 1], default: 1 }
      responses: { '200': { description: Pods } }
  /api/podlogs:
    get:
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: pod
          required: true
          schema: { type: string }
        - in: query
          name: container
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer }
        - in: query
          name: follow
          schema: { type: boolean }
      responses:
        '200':
          description: Bounded text snapshot, or authenticated SSE when follow is true.
  /api/workloadlogs:
    get:
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: kind
          required: true
          schema: { type: string }
        - in: query
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: tail
          schema: { type: integer }
        - in: query
          name: follow
          schema: { type: boolean }
      responses:
        '200':
          description: Bounded text snapshot, or multiplexed authenticated SSE when follow is true.
  /api/events:
    get:
      parameters:
        - in: query
          name: namespace
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: type
          description: Optional Kubernetes Event type, for example Warning.
          schema: { type: string }
      responses: { '200': { description: Events } }
  /api/deployments/scale:
    post:
      requestBody:
        required: true
      responses: { '200': { description: Scaled } }
  /api/deployments/restart:
    post:
      requestBody:
        required: true
      responses: { '200': { description: Restart triggered } }
  /api/pods/delete:
    post:
      requestBody:
        required: true
      responses: { '200': { description: Pod deleted } }
  /api/apply:
    post:
      requestBody:
        required: true
      responses: { '200': { description: Apply result } }
